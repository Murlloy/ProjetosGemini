<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Projetos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gerenciador de Projetos</h1>
        <nav>
            <a href="#/dashboard" data-tooltip="Ver painel de projetos">Dashboard</a>
            <a href="#/stats" data-tooltip="Ver estatísticas e histórico">Estatísticas</a>
        </nav>
        <button id="theme-toggle" aria-label="Alternar tema">☀️</button>
    </header>

    <main id="app-content">
        <!-- Conteúdo dinâmico será injetado aqui -->
    </main>

    <footer>
        <p>© 2024 Seu Nome. Feito com JS Puro!</p>
        <p id="offline-status" style="display:none; color: orange;">Você está offline.</p>
    </footer>

    <!-- Modals (Hidden by default) -->
    <div id="modal-backdrop" class="modal-backdrop" style="display:none;"></div>

    <div id="project-modal" class="modal" style="display:none;" role="dialog" aria-labelledby="project-modal-title" aria-modal="true">
        <h2 id="project-modal-title">Criar Novo Projeto</h2>
        <form id="project-form">
            <div>
                <label for="project-name">Nome do Projeto:</label>
                <input type="text" id="project-name" required>
            </div>
            <div>
                <label for="project-description">Descrição:</label>
                <textarea id="project-description" rows="3"></textarea>
            </div>
            <div class="modal-actions">
                <button type="submit">Salvar Projeto</button>
                <button type="button" class="cancel-btn">Cancelar</button>
            </div>
        </form>
    </div>

    <div id="task-modal" class="modal" style="display:none;" role="dialog" aria-labelledby="task-modal-title" aria-modal="true">
        <h2 id="task-modal-title">Criar Nova Tarefa</h2>
        <form id="task-form">
            <input type="hidden" id="task-project-id">
            <input type="hidden" id="task-id"> <!-- For editing -->
            <div>
                <label for="task-title">Título da Tarefa:</label>
                <input type="text" id="task-title" required>
            </div>
            <div>
                <label for="task-description">Descrição:</label>
                <textarea id="task-description" rows="3"></textarea>
            </div>
            <div>
                <label for="task-due-date">Data de Vencimento:</label>
                <input type="date" id="task-due-date">
            </div>
            <div>
                <label for="task-priority">Prioridade:</label>
                <select id="task-priority">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>
            </div>
             <div>
                <label for="task-status-modal">Status:</label>
                <select id="task-status-modal">
                    <option value="A Fazer">A Fazer</option>
                    <option value="Em Progresso">Em Progresso</option>
                    <option value="Concluído">Concluído</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="submit">Salvar Tarefa</button>
                <button type="button" class="cancel-btn">Cancelar</button>
            </div>
        </form>
    </div>

    <div id="login-modal" class="modal" style="display:none;" role="dialog" aria-labelledby="login-modal-title" aria-modal="true">
        <h2 id="login-modal-title">Login</h2>
        <form id="login-form">
            <div>
                <label for="username">Nome de Usuário:</label>
                <input type="text" id="username" required value="lucas"> <!-- Default for example -->
            </div>
            <div class="modal-actions">
                <button type="submit">Entrar</button>
            </div>
        </form>
    </div>


    <script src="script.js"></script>
</body>
</html>
