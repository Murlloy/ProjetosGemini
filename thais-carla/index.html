<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thais Carla - Peso em Tempo Real (Fictício)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Thais Carla (Emoji Edition)</h1>
        <p class="disclaimer">Este é um site de entretenimento fictício. O peso e as reações são simulados.</p>

        <div id="thais-emoji-container">
            <span id="thais-emoji" class="emoji-base">💁‍♀️</span>
        </div>

        <div id="weight-display">
            Peso Atual: <span id="current-weight">150.0</span> kg
        </div>

        <p class="feed-text">Alimente a Thais Carla Emoji:</p>
        <div class="buttons-container">
            <button id="feed-white" class="burger-button white" data-weight="0.5" title="Hambúrguer de Frango (+0.5kg)">🍔</button>
            <button id="feed-yellow" class="burger-button yellow" data-weight="0.8" title="Cheeseburger Clássico (+0.8kg)">🍔</button>
            <button id="feed-orange" class="burger-button orange" data-weight="1.2" title="Hambúrguer Duplo com Bacon (+1.2kg)">🍔</button>
            <button id="feed-purple" class="burger-button purple-neon" data-weight="2.0" title="Hambúrguer Galáctico Especial (+2.0kg)">🍔</button>
        </div>

        <div id="burger-animation-area">
            <!-- Hambúrgueres voadores aparecerão aqui -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
