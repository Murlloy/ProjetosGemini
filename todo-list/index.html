<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minha Lista de Tarefas</h1>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Adicionar nova tarefa...">
            <button id="addTaskBtn">Adicionar</button>
        </div>
        <ul id="taskList">
            <!-- Tarefas serão adicionadas aqui via JavaScript -->
        </ul>
        <p id="emptyMessage" class="empty-message" style="display: none;">Nenhuma tarefa ainda!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
